plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "com.chaquo.python"
}

android {
    namespace "cn.yuketang.runner"
    compileSdk 35

    defaultConfig {
        applicationId "cn.yuketang.runner"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "0.1.0"

        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion "1.5.15"
    }
}

dependencies {
    implementation platform("androidx.compose:compose-bom:2024.10.01")
    implementation "androidx.activity:activity-compose:1.9.3"
    implementation "androidx.compose.material:material-icons-extended"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-tooling-preview"
    debugImplementation "androidx.compose.ui:ui-tooling"
}

def generatedPythonDir = layout.buildDirectory.dir("generated/yuketangPython")

def syncYuketangPython = tasks.register("syncYuketangPython", Copy) {
    from(rootDir) {
        exclude "data/**"
        include "main.py"
        include "yuketang.py"
        include "util.py"
        include "send.py"
        include "llm.py"
        include "draw.py"
        include "msyh.ttc"
    }
    into generatedPythonDir
}

tasks.named("preBuild") {
    dependsOn syncYuketangPython
}

tasks.configureEach { task ->
    if (task.name.matches("merge.*PythonSources")) {
        task.dependsOn syncYuketangPython
    }
}

chaquopy {
    defaultConfig {
        version = "3.11"
        pip {
            install "-r", "$rootDir/requirements-android.txt"
        }
    }
    sourceSets {
        main {
            srcDir generatedPythonDir.get().asFile
            srcDir "src/main/python"
        }
    }
}
